[package]
name = "ghaudit-desktop"
version = "0.1.0"
edition = "2024"
# Tauri's dialog and opener plugins need 1.90; the ghaudit library and CLI stay on 1.88.
rust-version = "1.90"
description = "Desktop app for ghaudit, the security scanner for GitHub repositories"
license = "MIT"
repository = "https://github.com/Divhanthelion/ghaudit"
publish = false

[lib]
name = "ghaudit_desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ghaudit = { path = ".." }
tauri = { version = "2", features = [] }
# Used from Rust only: the page gets no file-system, dialog or opener permissions.
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["sync", "macros", "time", "process"] }
keyring-core = "1"

# A token the user enters is kept in each platform's credential store (src/keychain.rs).
[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[dev-dependencies]
tempfile = "3.20"
tokio = { version = "1.48", features = ["rt", "macros"] }
