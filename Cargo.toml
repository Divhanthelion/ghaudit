[package]
name = "ghaudit"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Security scanner for GitHub repositories: code patterns, leaked secrets, and vulnerable dependencies"
license = "MIT"
repository = "https://github.com/Divhanthelion/ghaudit"
readme = "README.md"
keywords = ["security", "sast", "secrets", "github", "sarif"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# Async runtime (network I/O, subprocesses) and data parallelism (file analysis)
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "process", "signal", "time", "fs"] }
rayon = "1.11"

# HTTP: GitHub REST API and the optional local LLM endpoint.
# rustls with the `ring` provider keeps the build free of CMake/NASM on Windows.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "rustls-tls-native-roots"] }

# Static analysis
tree-sitter = "0.26"
streaming-iterator = "0.1"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"

# File discovery (.gitignore-aware walking, glob excludes)
ignore = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"

# Pattern matching and hashing
regex = "1.11"
sha2 = "0.11"
base64 = "0.22"

# CLI, errors, logging
clap = { version = "4.5", features = ["derive", "env"] }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
tempfile = "3.20"
futures = "0.3"
# GitHub Actions workflow parsing (maintained fork of serde_yaml)
serde_yaml_ng = "0.10"
anstream = "1.0"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
