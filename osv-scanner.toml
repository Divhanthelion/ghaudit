# Advisories accepted for this repository's own scans (ghaudit honors this file only in
# trusted, local scans; a scan of the repository from GitHub still reports them).
# All come from the desktop app's Tauri dependencies, not from the ghaudit CLI or library.
# Each one expires so it is looked at again.

[[IgnoredVulns]]
id = "RUSTSEC-2024-0429"
ignoreUntil = 2027-04-01
reason = "glib 0.18 (unsound VariantStrIter): only in Linux builds of the desktop app, through Tauri 2's GTK 3 stack (muda -> gtk 0.18). The app never uses VariantStrIter. The fix is glib 0.20, which Tauri 2 does not use."

