name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked

  integration:
    name: osv-scanner integration and self-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Install osv-scanner
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.6.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Integration tests against the real osv-scanner
        run: cargo test --locked --test cli -- --include-ignored
      - name: Scan this repository with ghaudit
        run: cargo run --locked --release -- scan . --exclude tests/fixtures -f sarif -o ghaudit.sarif
      - name: Validate the SARIF report against the official schema
        if: always()
        run: pipx run check-jsonschema --schemafile https://www.schemastore.org/sarif-2.1.0.json ghaudit.sarif
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ghaudit-sarif
          path: ghaudit.sarif
